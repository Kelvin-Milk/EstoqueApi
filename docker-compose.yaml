services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: estoque
      POSTGRES_USER: ${DB_USER:-estoque}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-estoque}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-estoque} -d estoque"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/estoque
      DB_USER: ${DB_USER:-estoque}
      DB_PASSWORD: ${DB_PASSWORD:-estoque}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  pgdata: